# Gera o APK do EventFlow automaticamente no GitHub (gratuito).
#
# - A cada push que altera a pasta app/, o APK fica disponível na aba "Actions"
#   (abra a execução e baixe "EventFlow-apk" em Artifacts).
# - Ao publicar uma Release no GitHub (Releases > Draft a new release, tag v1.0),
#   o APK é anexado a ela, com um link fixo para entregar ao professor.
#
# A URL da API vem do arquivo app/.env.production (VITE_API_URL=...).
# Opcional: a variável de repositório API_URL (Settings > Secrets and variables > Actions > Variables)
# tem prioridade sobre o arquivo.
name: Gerar APK

on:
  push:
    branches: [main, master]
    paths: ['app/**', '.github/workflows/apk.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Definir URL da API
        run: |
          URL="${{ vars.API_URL }}"
          if [ -z "$URL" ] && [ -f .env.production ]; then
            URL=$(grep -E '^VITE_API_URL=' .env.production | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d '[:space:]')
          fi
          if [ -z "$URL" ] || echo "$URL" | grep -q "seunome"; then
            echo "::warning::APK não gerado: defina a URL da API publicada em app/.env.production (VITE_API_URL=https://...)"
            echo "PULAR=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "VITE_API_URL=${URL%/}" >> "$GITHUB_ENV"
          echo "API: ${URL%/}"

      - uses: actions/setup-node@v4
        if: env.PULAR != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        if: env.PULAR != 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        if: env.PULAR != 'true'
        run: npm ci

      - name: Build do app (Vue + Vite)
        if: env.PULAR != 'true'
        run: npm run build

      - name: Copiar o app para o projeto Android
        if: env.PULAR != 'true'
        run: npx cap sync android

      - name: Compilar APK
        if: env.PULAR != 'true'
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../EventFlow.apk

      - name: Disponibilizar APK (Actions > Artifacts)
        if: env.PULAR != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EventFlow-apk
          path: EventFlow.apk

      - name: Anexar o APK à Release
        if: env.PULAR != 'true' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: EventFlow.apk
