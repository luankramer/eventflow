# Gera o APK do EventFlow automaticamente no GitHub (gratuito).
#
# - A cada push que altera a pasta app/, o APK fica disponível na aba "Actions"
#   (abra a execução e baixe "EventFlow-apk" em Artifacts).
# - Ao criar uma tag (ex.: v1.0), o APK também é publicado em "Releases",
#   com um link fixo para entregar ao professor.
#
# Antes da primeira execução, cadastre a URL da API em:
#   Settings > Secrets and variables > Actions > aba Variables > New repository variable
#   Nome: API_URL    Valor: https://sua-api.koyeb.app
name: Gerar APK

on:
  push:
    branches: [main, master]
    paths: ['app/**', '.github/workflows/apk.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Conferir variável API_URL
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "::error::Cadastre a variável API_URL em Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "API: ${{ vars.API_URL }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Build do app (Vue + Vite)
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}

      - name: Copiar o app para o projeto Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../EventFlow.apk

      - name: Disponibilizar APK (Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: EventFlow-apk
          path: EventFlow.apk

      - name: Publicar na Release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EventFlow.apk
